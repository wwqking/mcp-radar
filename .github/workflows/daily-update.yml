name: 每日采集与部署

# 每天在 CI 里采集真实数据 → 写快照 → commit 回 master → 触发 Cloudflare Workers Builds。
# 采集/commit 在这里做（有 git 写权限、快照能持久累积趋势）；Cloudflare 负责 build+上线。

on:
  schedule:
    # UTC 22:00 = 北京时间次日 06:00，每天一次
    - cron: "0 22 * * *"
  workflow_dispatch: {} # 支持手动触发

# 允许 workflow 把快照 commit 回仓库
permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: 采集真实数据 + 写当天快照
        env:
          GITHUB_TOKEN: ${{ secrets.MCP_GITHUB_TOKEN }} # 只读 public_repo，仅 CI 用
          # Registry 元数据始终完整分页；800 是每天 GitHub/npm 深度富化预算，不再是来源窗口。
          MCP_COLLECT_LIMIT: ${{ vars.MCP_COLLECT_LIMIT || '800' }}
          # 每天优先尝试让这批“从未入库”的 Registry 候选进入目录。
          MCP_NEW_SERVER_LIMIT: ${{ vars.MCP_NEW_SERVER_LIMIT || '250' }}
          # 连续 3 次完整扫描都消失才移除，防止 Registry 临时抖动造成 URL/数量来回变。
          MCP_MISSING_GRACE_RUNS: ${{ vars.MCP_MISSING_GRACE_RUNS || '3' }}
        run: npm run collect

      - name: 提交数据集 + 快照（有变化才提交）
        # 提交 data/servers.json（build 直接读它，不再重新采集）+ data/snapshots（趋势历史）。
        # Cloudflare Workers Builds 已连接 master：这个 push 自动触发 build + 上线。
        run: |
          git config user.name "mcp-radar-bot"
          git config user.email "bot@mcpradars.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "chore: 每日数据更新 $(date -u +%Y-%m-%d)"
            git push
            echo "✓ 数据已更新并推送（将自动触发 Cloudflare 部署）"
          else
            echo "无数据变化，跳过提交（无需部署）"
          fi
